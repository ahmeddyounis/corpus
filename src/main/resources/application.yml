spring:
  application:
    name: corpus
  profiles:
    # `local` (Ollama, keyless) unless overridden via SPRING_PROFILES_ACTIVE.
    default: local
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  ai:
    # Providers are opted into per profile; `none` keeps unused autoconfigurations off.
    # chat/embedding are overridden per profile; the other modalities stay off for good.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      pgvector:
        # Flyway owns all DDL (see db/migration); never let the store create schema.
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${corpus.embedding.dimension}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    mcp:
      server:
        name: corpus
        version: 0.1.0
        # The autoconfiguration gate requires this to be explicit (matchIfMissing=false);
        # without it the legacy SSE transport wins.
        protocol: STREAMABLE
  flyway:
    placeholders:
      vector_dimension: ${corpus.embedding.dimension}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

corpus:
  # Environment variable names below are part of the documented contract (README).
  chunk:
    size: ${CORPUS_CHUNK_SIZE:512}
    overlap: ${CORPUS_CHUNK_OVERLAP:64}
  ingestion:
    # Must exceed the slowest legitimate ingestion: below this, a live instance's
    # in-flight work could be swept out from under it by another instance.
    stale-after: ${CORPUS_INGESTION_STALE_AFTER:15m}
  retrieval:
    top-k: ${CORPUS_RETRIEVAL_TOP_K:6}
    rrf-k: ${CORPUS_RRF_K:60}
    candidate-k: 20
  rate-limit:
    rpm: ${CORPUS_RATE_LIMIT_RPM:30}
    token-rpm: ${CORPUS_TOKEN_RATE_LIMIT_RPM:10}
  security:
    jwt:
      secret: ${CORPUS_JWT_SECRET:corpus-local-dev-secret-0123456789-abcdefghijklmnop}
      ttl: 24h
  embedding:
    dimension: 384
  mcp:
    # When set, unauthenticated /mcp calls act as this account (keyless profiles only).
    anonymous-user: ""
  # USD per million tokens; unknown models simply record no cost.
  pricing:
    models:
      claude-sonnet-4-5:
        input-per-mtok: 3.0
        output-per-mtok: 15.0
      claude-haiku-4-5:
        input-per-mtok: 1.0
        output-per-mtok: 5.0
      gpt-4o-mini:
        input-per-mtok: 0.15
        output-per-mtok: 0.6
      "qwen3:4b":
        input-per-mtok: 0.0
        output-per-mtok: 0.0
