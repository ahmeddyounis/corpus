spring:
  application:
    name: corpus
  http:
    clients:
      # Plural form: spring.http.client.* is deprecated in Boot 4 and silently ignored.
      # Governs the RestClient-based providers (Ollama); the Anthropic/OpenAI SDKs
      # have their own timeouts, set in application-cloud.yml.
      connect-timeout: 5s
      read-timeout: 60s
  lifecycle:
    # Must exceed the executor termination timeouts (corpus.async.*) and stay under
    # the platform kill timeout: Helm terminationGracePeriodSeconds / Fly kill_timeout.
    timeout-per-shutdown-phase: 45s
  profiles:
    # `local` (Ollama, keyless) unless overridden via SPRING_PROFILES_ACTIVE.
    default: local
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  ai:
    # Providers are opted into per profile; `none` keeps unused autoconfigurations off.
    # chat/embedding are overridden per profile; the other modalities stay off for good.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      pgvector:
        # Flyway owns all DDL (see db/migration); never let the store create schema.
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${corpus.embedding.dimension}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    retry:
      # Default is 10 attempts with 2s x5 backoff, which stacks on top of the SDKs'
      # own retries: a worst case measured in hours. Two attempts is enough to ride
      # out a blip without hiding a real outage from the circuit breaker.
      max-attempts: 2
      on-client-errors: false
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 3s
    mcp:
      server:
        name: corpus
        version: 0.1.0
        # The autoconfiguration gate requires this to be explicit (matchIfMissing=false);
        # without it the legacy SSE transport wins.
        protocol: STREAMABLE
  datasource:
    hikari:
      pool-name: corpus-pool
      # Retrieval issues two concurrent queries per request and ingestion holds one
      # per document (capped at corpus.async.ingestion-concurrency). Deployment
      # constraint: replicas x maximum-pool-size must fit the server's connection cap.
      maximum-pool-size: ${CORPUS_DB_POOL_SIZE:10}
      minimum-idle: 2
      # HikariDataSource binds raw milliseconds, not Spring Duration strings.
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1500000
      keepalive-time: 120000
      leak-detection-threshold: 20000
      data-source-properties:
        # Bounds a runaway HNSW scan or pathological tsquery instead of letting it
        # hold a connection indefinitely.
        options: "-c statement_timeout=15000 -c idle_in_transaction_session_timeout=30000"
  flyway:
    placeholders:
      vector_dimension: ${corpus.embedding.dimension}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Never leak component details (datasource URLs, provider names) to anonymous
      # callers: /actuator/health is permitAll so load balancers can reach it.
      # show-components deliberately left to follow show-details: an anonymous
      # caller on this permitAll endpoint sees only the overall status, never the
      # component inventory.
      show-details: when-authorized
      cache:
        time-to-live: 2s
      group:
        # Readiness gates traffic: the database is required to serve anything.
        # The chat breaker is deliberately absent — see ChatModelHealthIndicator.
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    diskspace:
      enabled: false

corpus:
  # Environment variable names below are part of the documented contract (README).
  chunk:
    size: ${CORPUS_CHUNK_SIZE:512}
    overlap: ${CORPUS_CHUNK_OVERLAP:64}
  ingestion:
    # Must exceed the slowest legitimate ingestion: below this, a live instance's
    # in-flight work could be swept out from under it by another instance.
    stale-after: ${CORPUS_INGESTION_STALE_AFTER:15m}
  async:
    ingestion-concurrency: ${CORPUS_INGESTION_CONCURRENCY:4}
    ingestion-termination: 30s
    chat-termination: 20s
    retrieval-termination: 5s
  retrieval:
    top-k: ${CORPUS_RETRIEVAL_TOP_K:6}
    rrf-k: ${CORPUS_RRF_K:60}
    candidate-k: 20
  rate-limit:
    rpm: ${CORPUS_RATE_LIMIT_RPM:30}
    token-rpm: ${CORPUS_TOKEN_RATE_LIMIT_RPM:10}
    # memory = per instance (N replicas give each user N x the budget);
    # postgres = fleet-wide. Deployed profiles override this.
    backend: ${CORPUS_RATE_LIMIT_BACKEND:memory}
  resilience:
    enabled: ${CORPUS_RESILIENCE_ENABLED:true}
    sliding-window-size: 20
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    slow-call-duration-threshold: 120s
    wait-duration-in-open-state: 30s
  security:
    jwt:
      secret: ${CORPUS_JWT_SECRET:corpus-local-dev-secret-0123456789-abcdefghijklmnop}
      ttl: 24h
  embedding:
    dimension: 384
  mcp:
    # When set, unauthenticated /mcp calls act as this account (keyless profiles only).
    anonymous-user: ""
  # USD per million tokens; unknown models simply record no cost.
  pricing:
    models:
      claude-sonnet-4-5:
        input-per-mtok: 3.0
        output-per-mtok: 15.0
      claude-haiku-4-5:
        input-per-mtok: 1.0
        output-per-mtok: 5.0
      gpt-4o-mini:
        input-per-mtok: 0.15
        output-per-mtok: 0.6
      "qwen3:4b":
        input-per-mtok: 0.0
        output-per-mtok: 0.0
