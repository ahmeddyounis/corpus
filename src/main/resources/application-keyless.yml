# Everything except chat, with zero credentials: in-process ONNX embeddings.
# Ingestion, hybrid search, MCP search/list, and metrics all work; /api/chat
# and ask_documents return a clear 503. Used for the compose smoke test.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/corpus}
    username: ${SPRING_DATASOURCE_USERNAME:corpus}
    password: ${SPRING_DATASOURCE_PASSWORD:corpus}
  ai:
    mcp:
      server:
        # Stateless: no per-JVM session map, so any replica answers any call and no
        # sticky sessions are required. All three Corpus tools are request/response,
        # so the server-initiated notifications this gives up are unused.
        protocol: STATELESS
    model:
      chat: none
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ${CORPUS_ONNX_CACHE:/tmp/corpus-onnx}

corpus:
  embedding:
    dimension: 384
  mcp:
    anonymous-user: demo

server:
  # Behind a proxy (Fly, Render, a k8s ingress) getRemoteAddr() returns the
  # proxy's address, which would collapse every anonymous caller into one
  # rate-limit bucket. RemoteIpValve rewrites it from the forwarded header, and
  # only when the immediate peer is a trusted proxy, so a client cannot forge it.
  forward-headers-strategy: NATIVE
  tomcat:
    remoteip:
      remote-ip-header: ${CORPUS_REMOTE_IP_HEADER:x-forwarded-for}
      protocol-header: x-forwarded-proto
