spring:
  ai:
    model:
      # Chat is stubbed in tests (see support/StubChatConfig); embeddings run
      # in-process via ONNX all-MiniLM-L6-v2 so the suite is keyless.
      chat: none
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ${user.dir}/.onnx-cache

corpus:
  embedding:
    dimension: 384
  mcp:
    anonymous-user: demo
  pricing:
    models:
      # The stub model reports no model id; priced here so cost metrics are assertable.
      unknown:
        input-per-mtok: 1.0
        output-per-mtok: 2.0
  rate-limit:
    rpm: 500
  security:
    jwt:
      secret: corpus-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
