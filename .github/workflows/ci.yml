name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache ONNX embedding model
        uses: actions/cache@v4
        with:
          path: .onnx-cache
          key: onnx-all-minilm-l6-v2-${{ runner.os }}

      # Unit + integration (Testcontainers pgvector) + PR-tier retrieval evals
      # (recall@5 / MRR gates) + JaCoCo line-coverage gate — fully keyless.
      - name: Build, test, evals, coverage gate
        run: ./gradlew build --no-daemon

      - name: Upload test and eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports
          retention-days: 14

      - name: Build Docker image
        run: docker build -t corpus:${{ github.sha }} .
