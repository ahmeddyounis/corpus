# Golden evaluation set for Corpus retrieval + answer quality.
#
# Six of the sample documents are deliberate distractors: they cover the same
# vocabulary as a real source but answer a different question (index tuning in
# general vs. what Corpus configures, IR metric definitions vs. Corpus's gates).
# Cases tagged `hard` are the ones whose keywords appear in both, so a system
# that matches on surface terms alone ranks the wrong document first.
# Each case: a question, the sample document(s) that contain the answer, and a
# reference answer used by the nightly LLM-as-judge evals. Per sample document
# there are two flavors: one keyword-heavy question (exercises the full-text
# leg) and one paraphrase (exercises the vector leg). Changes here are
# reviewed like code — the CI thresholds are only as honest as this file.
version: 1
cases:
  - id: arch-monolith-why
    tags: [paraphrase]
    question: "Why is Corpus built as a modular monolith instead of microservices?"
    expected_sources: [corpus-architecture.md]
    reference_answer: >-
      At this scale network boundaries add serialization overhead, deployment
      orchestration, and distributed failure modes without benefit, since the
      hot path is dominated by model inference latency. One deployable keeps
      the demo runnable with a single docker compose up, keeps stack traces
      whole, and keeps refactoring cheap, while strict package boundaries
      (ingestion, retrieval, chat, mcp, ops, security) preserve the seams
      where services could split later.

  - id: arch-first-split
    question: "If the application ever had to be broken apart into separate services, which part should be extracted first and why?"
    expected_sources: [corpus-architecture.md]
    reference_answer: >-
      Ingestion would be extracted first: it is already asynchronous,
      communicates through the database, and has bursty resource demands from
      parsing large documents. Retrieval would be the second seam as a
      stateless search service over the same PostgreSQL.

  - id: pgvector-hnsw-params
    question: "What do the m and ef_construction parameters control in the HNSW index?"
    expected_sources: [pgvector-guide.md]
    reference_answer: >-
      m controls how many bidirectional links each node keeps in the graph
      (Corpus uses 16); higher values build a denser graph with better recall
      at the cost of memory and build time. ef_construction (Corpus uses 64)
      controls the candidate-list size during index construction; larger
      values explore more neighbors per insertion and produce a higher-quality
      graph at slower build speed.

  - id: pgvector-distance-choice
    question: "Which similarity measure does the vector index use, and why was it chosen?"
    expected_sources: [pgvector-guide.md]
    reference_answer: >-
      Cosine distance (vector_cosine_ops, the <=> operator), because sentence
      embedding models are trained for cosine similarity. With normalized
      embeddings cosine and inner product rank identically, and cosine is the
      safe default when normalization cannot be guaranteed.

  - id: chunking-defaults
    question: "What are the default values of CORPUS_CHUNK_SIZE and CORPUS_CHUNK_OVERLAP?"
    expected_sources: [chunking-strategies.md]
    reference_answer: >-
      The default chunk size is 512 tokens and the default overlap is 64
      tokens, counted with the cl100k_base tokenizer; the window advances by
      size minus overlap.

  - id: chunking-overlap-purpose
    question: "Why do neighboring text pieces share some words at their edges?"
    expected_sources: [chunking-strategies.md]
    reference_answer: >-
      The 64-token overlap heals boundary cuts: a sentence or fact that
      straddles a window edge appears whole in the next window, so at least
      one chunk preserves it intact. The cost is modest duplication of stored
      tokens.

  - id: evals-thresholds
    question: "What thresholds gate recall@5 and MRR in CI?"
    expected_sources: [rag-evaluation.md]
    reference_answer: >-
      The build gates retrieval at recall@3 of at least 0.82, recall@5 of at
      least 0.88, MRR of at least 0.74, and nDCG@5 of at least 0.76, computed
      per pull request over the golden set with deterministic in-process
      embeddings.

  - id: evals-hallucination-check
    question: "How does the project check that generated answers are not making things up?"
    expected_sources: [rag-evaluation.md]
    reference_answer: >-
      With nightly LLM-as-judge evals: a judge model scores each answer's
      faithfulness (every claim supported by the retrieved context, no
      hallucinated additions) and answer relevance on a 0 to 1 scale, and the
      build gates both at a mean of at least 0.80.

  - id: mcp-session-header
    question: "What is the Mcp-Session-Id header used for?"
    expected_sources: [mcp-protocol.md]
    reference_answer: >-
      The server assigns a session during the initialize handshake and the
      client echoes it back in the Mcp-Session-Id header on every subsequent
      request of that session over the streamable HTTP transport.

  - id: mcp-claude-desktop
    question: "How can Claude Desktop use this service's search from inside a conversation?"
    expected_sources: [mcp-protocol.md]
    reference_answer: >-
      Corpus is an MCP server: Claude Desktop connects over the streamable
      HTTP transport at /mcp, discovers tools via tools/list, and can then
      call search_documents, ask_documents, and list_documents as native
      tools during a conversation.

  - id: jwt-algorithm-claims
    question: "Which signing algorithm secures the JWTs and which claim carries the user id?"
    expected_sources: [jwt-security-primer.md]
    reference_answer: >-
      Tokens are signed with HMAC-SHA256 (HS256) using a symmetric secret of
      at least 256 bits, and the sub claim carries the user's UUID; tokens
      live for 24 hours.

  - id: jwt-cross-user
    question: "Why can't a valid token for one user be used to read another user's documents?"
    expected_sources: [jwt-security-primer.md]
    reference_answer: >-
      Authorization is structural: the authenticated user's UUID from the
      token's subject claim is applied as a filter in SQL queries and vector
      filter expressions at the storage layer, so queries for another user's
      data physically return nothing — scoping does not depend on controller
      checks.

  - id: obs-cost-metric
    question: "What does the corpus_llm_cost_estimate_usd_total metric represent?"
    expected_sources: [observability-llm.md]
    reference_answer: >-
      An estimated LLM spend counter: token usage per model is multiplied by
      a configurable price table (dollars per million tokens) to attribute
      approximate cost by provider and model — intended for trends and
      attribution, not accounting-grade precision.

  - id: obs-slowness-diagnosis
    question: "How can I tell whether slowness comes from the database lookup or from the language model?"
    expected_sources: [observability-llm.md]
    reference_answer: >-
      Per-phase latency timers separate the pipeline: a slow retrieval p95
      points at the database or candidate set, while fast retrieval with a
      slow first_token phase points at the model provider or prompt size.
      Each phase publishes histogram buckets so Prometheus can compute
      percentiles.

  - id: springai-provider-switch
    question: "What does the spring.ai.model.chat property select?"
    expected_sources: [spring-ai-overview.md]
    reference_answer: >-
      It selects which chat provider autoconfigures the active ChatModel —
      anthropic, openai, ollama, or none to disable chat — making provider
      switching a configuration change rather than a code change; embeddings
      are selected independently via spring.ai.model.embedding.

  - id: springai-memory
    question: "How does the assistant remember earlier messages in the same conversation?"
    expected_sources: [spring-ai-overview.md]
    reference_answer: >-
      A memory advisor in the ChatClient advisor chain loads the last twenty
      messages of the active conversation into the prompt before each call
      and persists new turns afterwards, keyed by a conversation id
      parameter.

  # --- distractor-sensitive cases -------------------------------------------

  - id: hnsw-corpus-actual-values
    tags: [hard]
    question: "Which HNSW build parameters does Corpus itself configure, and to what values?"
    expected_sources: [pgvector-guide.md]
    related_sources: [hnsw-vs-ivfflat.md]
    reference_answer: >-
      Corpus builds its HNSW index with m = 16 and ef_construction = 64 over
      vector_cosine_ops.

  - id: ivfflat-empty-table
    tags: [hard]
    question: "Why does building an index on an empty table hurt IVFFlat but not HNSW?"
    expected_sources: [hnsw-vs-ivfflat.md]
    related_sources: [pgvector-guide.md]
    reference_answer: >-
      IVFFlat derives its partitions by clustering the vectors present at build
      time, so an index built on an empty table has meaningless partitions and
      recall collapses. HNSW builds a navigable graph incrementally and stays
      accurate as rows arrive.

  - id: corpus-gate-values
    tags: [hard]
    question: "What retrieval scores must Corpus achieve for the build to pass?"
    expected_sources: [rag-evaluation.md]
    related_sources: [retrieval-metrics-glossary.md]
    reference_answer: >-
      The build gates retrieval quality on the golden set and fails when the
      thresholds are not met; the current gates are recorded in the evaluation
      documentation and enforced by the retrieval eval test.

  - id: ndcg-definition
    tags: [hard]
    question: "How is discounted cumulative gain normalised, and why use it over MRR?"
    expected_sources: [retrieval-metrics-glossary.md]
    related_sources: [rag-evaluation.md]
    reference_answer: >-
      Each result contributes gain discounted logarithmically by position, and
      the sum is divided by the ideal ordering's score to give a value in [0,1].
      It is preferred over MRR when several results matter and their relative
      ordering matters, not just the position of the first hit.

  - id: corpus-signing-choice
    tags: [hard]
    question: "Which signing algorithm does Corpus use for its own tokens?"
    expected_sources: [jwt-security-primer.md]
    related_sources: [oauth2-vs-jwt.md]
    reference_answer: >-
      HMAC-SHA256 (HS256) with a symmetric secret of at least 256 bits, chosen
      because a single service issues and validates its own tokens.

  - id: algorithm-confusion-attack
    tags: [hard]
    question: "How can a validator be tricked into accepting a token signed with the wrong algorithm?"
    expected_sources: [oauth2-vs-jwt.md]
    related_sources: [jwt-security-primer.md]
    reference_answer: >-
      Algorithm confusion: a validator that trusts the token's own alg header can
      be induced to verify an RS256 token as HS256 using the public key as the
      HMAC secret. Pinning the expected algorithm at the validator prevents it.

  - id: corpus-chunk-defaults-vs-budget
    tags: [hard]
    question: "What chunk size and overlap does Corpus use by default?"
    expected_sources: [chunking-strategies.md]
    related_sources: [token-budgeting.md]
    reference_answer: >-
      512 tokens with 64 tokens of overlap, counted with the cl100k_base
      tokenizer, both configurable via CORPUS_CHUNK_SIZE and CORPUS_CHUNK_OVERLAP.

  - id: context-diminishing-returns
    tags: [hard]
    question: "Why does adding more retrieved passages to a prompt eventually stop helping?"
    expected_sources: [token-budgeting.md]
    related_sources: [chunking-strategies.md, rag-evaluation.md]
    reference_answer: >-
      Marginal recall gain flattens while cost keeps rising linearly, and long
      contexts dilute attention with position effects that disadvantage material
      in the middle, so a smaller well-ordered context often beats a larger one.

  - id: corpus-rrf-constant
    tags: [hard]
    question: "What fusion constant does Corpus use when merging its two retrieval legs?"
    expected_sources: [corpus-architecture.md, pgvector-guide.md, rag-evaluation.md]
    related_sources: [reranking-and-fusion.md]
    reference_answer: >-
      Reciprocal Rank Fusion with k = 60, configurable through CORPUS_RRF_K.

  - id: cross-encoder-vs-bi-encoder
    tags: [hard]
    question: "Why can't a cross-encoder score be precomputed at index time?"
    expected_sources: [reranking-and-fusion.md]
    related_sources: [spring-ai-overview.md]
    reference_answer: >-
      A cross-encoder takes the query and candidate together as a single input
      and scores them jointly, so its score depends on the query and cannot exist
      before the query does. Bi-encoders embed documents independently, which is
      what makes them precomputable.

  - id: overretrieve-before-rerank
    tags: [hard]
    question: "Why should the first retrieval stage return more candidates than the final answer uses?"
    expected_sources: [reranking-and-fusion.md]
    related_sources: [rag-evaluation.md]
    reference_answer: >-
      Fusing to exactly the final k leaves the reranker only able to permute;
      over-retrieving lets it promote something the first stage ranked poorly,
      which is where most of the measured gain comes from.

  - id: tool-identity-authority
    tags: [hard]
    question: "Who decides which user a tool call acts as?"
    expected_sources: [tool-calling-patterns.md, spring-ai-overview.md]
    related_sources: [mcp-protocol.md]
    reference_answer: >-
      The application, from the authenticated request context — never the model.
      The model decides whether to call a tool; identity must not be derivable
      from tool arguments, or the tool becomes a privilege-escalation primitive.

  - id: mcp-transport-choice
    tags: [hard]
    question: "What advantage does streamable HTTP have over the older SSE transport?"
    expected_sources: [mcp-protocol.md]
    related_sources: [tool-calling-patterns.md]
    reference_answer: >-
      It behaves like ordinary HTTP on a single endpoint, so it works through
      load balancers, proxies, and API gateways without the separate
      event/message endpoints and sticky-session handling the older SSE
      transport required.

  - id: corpus-cost-metric-name
    tags: [keyword]
    question: "Which metric records estimated LLM spend?"
    expected_sources: [observability-llm.md]
    related_sources: [token-budgeting.md]
    reference_answer: >-
      corpus_llm_cost_estimate_usd_total, produced by multiplying token usage by
      a configurable per-million-token price table and tagged by provider and model.

  - id: output-vs-input-pricing
    tags: [hard]
    question: "Which costs more per token, the prompt or the completion?"
    expected_sources: [token-budgeting.md]
    related_sources: [observability-llm.md]
    reference_answer: >-
      Output tokens are generally priced several times higher than input tokens,
      which makes response-length instructions a real cost control.

  - id: corpus-phase-timers
    tags: [keyword]
    question: "Which pipeline phases does Corpus time separately?"
    expected_sources: [observability-llm.md]
    related_sources: [token-budgeting.md]
    reference_answer: >-
      embedding, retrieval, first_token, and full_response, each a Micrometer
      timer with histogram buckets so percentiles can be computed per phase.
