apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "corpus.fullname" . }}-test"
  labels:
    {{- include "corpus.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.11.1
      # Readiness plus a real request path. A test that only checks liveness
      # would pass against an instance that cannot reach its database.
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "readiness:"
          curl -sf "http://{{ include "corpus.fullname" . }}:{{ .Values.service.port }}/actuator/health/readiness"
          echo "\nauth:"
          TOKEN=$(curl -sf -X POST "http://{{ include "corpus.fullname" . }}:{{ .Values.service.port }}/api/auth/token" \
            -H 'Content-Type: application/json' -d '{"username":"demo","password":"demo"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$TOKEN"
          echo "\ndocuments:"
          curl -sf -H "Authorization: Bearer $TOKEN" \
            "http://{{ include "corpus.fullname" . }}:{{ .Values.service.port }}/api/documents?size=1"
