{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "corpus.serviceAccountName" . }}
  labels:
    {{- include "corpus.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application talks to Postgres and an LLM provider, never to the Kubernetes
# API, so it has no reason to carry a mounted API token.
automountServiceAccountToken: false
{{- end }}
