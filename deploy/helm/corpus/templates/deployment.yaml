apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "corpus.fullname" . }}
  labels:
    {{- include "corpus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "corpus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls pods when configuration changes; without this a ConfigMap edit
        # leaves every replica running the old values indefinitely.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "corpus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "corpus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: corpus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.profile | quote }}
            # Stable per-pod identity. Ingestion ownership is scoped by it, so a
            # restart-in-place reclaims its own stranded documents by the fast
            # path rather than waiting out the age fallback.
            - name: CORPUS_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: {{ include "corpus.fullname" . }}-config
            - secretRef:
                name: {{ include "corpus.secretName" . }}
          lifecycle:
            preStop:
              exec:
                # Endpoint removal is eventually consistent; this gives proxies
                # time to stop routing before the JVM begins shutting down.
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # ONNX Runtime extracts its native library here and System.load()s
            # it, so this mount must not be noexec. emptyDir is exec by default.
            - name: tmp
              mountPath: /tmp
            - name: onnx-cache
              mountPath: /var/cache/corpus-onnx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.volumes.tmpSizeLimit }}
        - name: onnx-cache
          {{- if .Values.volumes.onnxCache.persistent }}
          persistentVolumeClaim:
            claimName: {{ include "corpus.fullname" . }}-onnx
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.volumes.onnxCache.size }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
